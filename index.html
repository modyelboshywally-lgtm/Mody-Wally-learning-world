<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mody & Wally Learning World</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fff8e8;
      color: #26345b;
    }
    header {
      background: #55b9ed;
      color: white;
      padding: 35px 15px;
    }
    h1 { font-size: 38px; }
    main { padding: 30px 15px; }
    .activities {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }
    .activity {
      background: white;
      padding: 25px;
      border-radius: 18px;
      width: 210px;
      box-shadow: 0 3px 12px #ddd;
    }
    footer { padding: 25px; }
  </style>
</head>
<body>
  <header>
    <h1>Mody & Wally</h1>
    <h2>Learning World</h2>
    <p>Learn • Play • Explore • Create!</p>
  </header>

  <main>
    <h2>Welcome, Little Learners!</h2>
    <div class="activities">
      <div class="activity">🔤<h3>Alphabet World</h3></div>
      <div class="activity">🎮<h3>Interactive Activities</h3></div>
      <div class="activity">🧩<h3>Word Games</h3></div>
      <div class="activity">🎨<h3>Coloring Pages</h3></div>
      <div class="activity">📖<h3>Stories</h3></div>
      <div class="activity">🎬<h3>Videos</h3></div>
      <div class="activity">📚<h3>Free Downloads</h3></div>
    </div>
  </main>

  <footer>
    Mody & Wally © 2026
  </footer>
</body>
</html>
